# Leaf-spine fabric: 2 spines, 2 leaves, one host behind each leaf.
# Every leaf links to every spine, so any host can reach any other in two hops
# through either spine. Routing is eBGP on unnumbered interfaces (IPv6 link-local
# sessions carrying IPv4 routes), one private AS per leaf and one for the spines.
name: fabric

topology:
  kinds:
    linux:
      image: quay.io/frrouting/frr:10.1.1
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv6.conf.all.disable_ipv6: 0
        net.ipv6.conf.all.forwarding: 1
  nodes:
    spine1:
      kind: linux
      binds:
        - ../configs/daemons:/etc/frr/daemons
        - ../configs/spine1.conf:/etc/frr/frr.conf
    spine2:
      kind: linux
      binds:
        - ../configs/daemons:/etc/frr/daemons
        - ../configs/spine2.conf:/etc/frr/frr.conf
    leaf1:
      kind: linux
      binds:
        - ../configs/daemons:/etc/frr/daemons
        - ../configs/leaf1.conf:/etc/frr/frr.conf
    leaf2:
      kind: linux
      binds:
        - ../configs/daemons:/etc/frr/daemons
        - ../configs/leaf2.conf:/etc/frr/frr.conf
    host1:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 10.1.1.10/24 dev eth1
        - ip route replace default via 10.1.1.1
    host2:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 10.1.2.10/24 dev eth1
        - ip route replace default via 10.1.2.1

  links:
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
    - endpoints: ["leaf1:eth3", "host1:eth1"]
    - endpoints: ["leaf2:eth3", "host2:eth1"]
