name: fabric

# Builds the leaf-spine lab on a fresh Linux runner and checks it, on every push.
on:
  push:
  workflow_dispatch:

jobs:
  fabric:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check what this runner supports (Docker, tc, netem, netns, BBR, jumbo MTU)
        run: sh scripts/check_runner.sh
      - name: Install Containerlab
        run: bash -c "$(curl -sL https://get.containerlab.dev)" -- -v 0.59.0
      - name: Pull images
        run: |
          docker pull quay.io/frrouting/frr:10.1.1
          docker pull alpine:3.20
      - name: Deploy the fabric
        run: sudo containerlab deploy -t topology/fabric.clab.yml
      - name: Which config lines does FRR reject?
        run: |
          for n in spine1 leaf1; do
            echo "=== $n: dry-run of frr.conf"
            sudo docker exec clab-fabric-$n vtysh --dryrun -f /etc/frr/frr.conf 2>&1 || true
            echo "=== $n: frr log lines mentioning errors"
            sudo docker logs clab-fabric-$n 2>&1 | grep -iE "error|unknown|fail" | head -20 || true
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==8.3.3
      - name: Check routing and reachability
        run: sudo -E env "PATH=$PATH" python -m pytest -v tests/test_fabric.py
      - name: Break it on purpose and measure recovery
        run: sudo -E env "PATH=$PATH" python -m pytest -v -s tests/test_failures.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failures
          path: results/failures.json
          if-no-files-found: ignore
      - name: Show BGP and routes (for the log)
        if: always()
        run: |
          for n in spine1 spine2 leaf1 leaf2; do
            echo "=== $n"; sudo docker exec clab-fabric-$n vtysh -c 'show bgp ipv4 unicast summary' -c 'show ip route bgp' || true
          done
